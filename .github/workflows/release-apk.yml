name: Build downloadable APK release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Read app version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          from pathlib import Path

          version_name = ""
          version_code = ""
          for gradle_file in (Path("app/build.gradle"), Path("app/build.gradle.kts")):
              if not gradle_file.exists():
                  continue

              match = re.search(
                  r'^\s*versionName\s*(?:=|\s)\s*["\']?([^"\'\s]+)',
                  gradle_file.read_text(encoding="utf-8", errors="ignore"),
                  re.MULTILINE,
              )
              if match:
                  version_name = match.group(1)
                  code_match = re.search(r'^\s*versionCode\s*(?:=|\s)\s*(\d+)', gradle_file.read_text(encoding="utf-8"), re.MULTILINE)
                  version_code = code_match.group(1) if code_match else ""
                  break

          if not version_name:
              version_name = f"0.0.{os.environ['GITHUB_RUN_NUMBER']}"

          safe_version = re.sub(r"[^A-Za-z0-9._-]+", "-", version_name).strip("-")
          print(f"APP_VERSION={safe_version or '0.0.' + os.environ['GITHUB_RUN_NUMBER']}")
          if not version_code:
              raise SystemExit("Missing versionCode")
          print(f"APP_BUILD={version_code}")
          PY

      - name: Prepare versioned downloadable APK
        shell: bash
        run: |
          mkdir -p release
          repo_name="${GITHUB_REPOSITORY#*/}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk_path="app/build/outputs/apk/debug/app-${abi}-debug.apk"
            test -f "$apk_path"
            cp "$apk_path" "release/${repo_name}-v${APP_VERSION}-build-${APP_BUILD}-${abi}-debug.apk"
          done

      - name: Publish downloadable GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-v${{ env.APP_VERSION }}
          name: CI Debug APK v${{ env.APP_VERSION }} build ${{ env.APP_BUILD }}
          body: |
            Automatically built debug APK from the latest default-branch commit.

            APK file names include the app version, build number, and CPU architecture.
            CI debug builds use the runner's debug signing key. For in-place updates, use the latest verified release built with the existing signing key.
          artifacts: release/*.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
